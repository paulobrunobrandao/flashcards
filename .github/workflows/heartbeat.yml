name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 9 * * *'  # Todo dia às 9h (UTC)
  workflow_dispatch:      # Permite disparar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            -H "apikey: ${{x!W1Jz3#wC2f$jfJ}}" \
            -H "Authorization: Bearer ${{x!W1Jz3#wC2f$jfJ}}" \
            "https://xtodghuyenpjnuifbrqg.supabase.co/rest/v1/cards?select=count"
